workflows:
  android-apk:
    name: Mestre da Tabuada 5.1
    max_build_duration: 60

    environment:
      java: 17

    scripts:
      - name: Verificar projeto Android
        script: |
          echo "========================================"
          echo "Mestre da Tabuada 5.1"
          echo "Diretório: $(pwd)"
          echo "========================================"

          test -f settings.gradle || { echo "ERRO: settings.gradle não encontrado"; exit 1; }
          test -f app/build.gradle || { echo "ERRO: app/build.gradle não encontrado"; exit 1; }

          echo "--- Estrutura do projeto ---"
          find . -maxdepth 3 -type f | sort

      - name: Compilar APK
        script: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug --stacktrace

    artifacts:
      - app/build/outputs/apk/debug/*.apk

    publishing:
      email:
        recipients:
          - danielmarkpsn@gmail.com
        notify:
          success: true
          failure: true
