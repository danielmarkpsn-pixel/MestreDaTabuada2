workflows:
  android-apk:
    name: Mestre da Tabuada 5.1
    max_build_duration: 60

    environment:
      java: 17

    scripts:
      - name: Verificar projeto Android
        script: |
          echo "Diretório atual: $(pwd)"
          test -f settings.gradle || { echo "ERRO: settings.gradle não está na raiz."; exit 1; }
          test -f app/build.gradle || { echo "ERRO: app/build.gradle não está na raiz."; exit 1; }
          echo "--- settings.gradle ---"
          cat settings.gradle
          echo "--- app/build.gradle ---"
          cat app/build.gradle
          echo "--- tarefas Gradle ---"
          gradle tasks --all --no-daemon

      - name: Compilar APK
        script: |
          gradle --no-daemon :app:assembleDebug --stacktrace

    artifacts:
      - app/build/outputs/apk/debug/*.apk

    publishing:
      email:
        recipients:
          - danielmarkpsn@gmail.com
        notify:
          success: true
          failure: true
