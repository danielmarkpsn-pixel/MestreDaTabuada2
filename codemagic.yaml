workflows:
  android-release:
    name: Mestre da Tabuada 5.3.10 RELEASE
    max_build_duration: 60

    environment:
      java: 17
      android_signing:
        - mestre_tabuada_release

    scripts:
      - name: Verificar projeto e assinatura
        script: |
          echo "========================================"
          echo "Mestre da Tabuada 5.3.10 RELEASE"
          echo "========================================"
          test -f settings.gradle || { echo "ERRO: settings.gradle não encontrado"; exit 1; }
          test -f app/build.gradle || { echo "ERRO: app/build.gradle não encontrado"; exit 1; }
          test -n "$CM_KEYSTORE_PATH" || { echo "ERRO: keystore do Codemagic não foi carregado."; exit 1; }
          test -f "$CM_KEYSTORE_PATH" || { echo "ERRO: arquivo de keystore não encontrado."; exit 1; }
          test -n "$CM_KEY_ALIAS" || { echo "ERRO: alias da chave não foi carregado."; exit 1; }
          echo "Assinatura de release configurada pelo Codemagic."

      - name: Compilar APK RELEASE
        script: |
          gradle --no-daemon :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Verificar assinatura dos arquivos RELEASE
        script: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" -type f | head -1)
          test -n "$APK" || { echo "ERRO: APK release não encontrado"; exit 1; }
          echo "APK: $APK"
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner | sort -V | tail -1)
          test -n "$APKSIGNER" || { echo "ERRO: apksigner não encontrado"; exit 1; }
          "$APKSIGNER" verify --verbose "$APK"
          AAB=$(find app/build/outputs/bundle/release -name "*.aab" -type f | head -1)
          test -n "$AAB" || { echo "ERRO: AAB release não encontrado"; exit 1; }
          echo "AAB: $AAB"
          jarsigner -verify "$AAB" >/dev/null || { echo "ERRO: assinatura do AAB não validada"; exit 1; }
          echo "Assinatura do APK e AAB validada."

    artifacts:
      - app/build/outputs/apk/release/*.apk
      - app/build/outputs/bundle/release/*.aab

    publishing:
      email:
        recipients:
          - danielmarkpsn@gmail.com
        notify:
          success: true
          failure: true
