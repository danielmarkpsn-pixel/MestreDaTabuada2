plugins {
    id 'com.android.application'
}

android {
    namespace "com.danielmarques.mestredatabuada"
    compileSdk 35

    defaultConfig {
        applicationId "com.danielmarques.mestredatabuada"
        minSdk 23
        targetSdk 35
        versionCode 57
        versionName "5.3.4"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Assinatura de release.
// No Codemagic, a chave é injetada de forma segura pelas Code Signing Identities.
// Localmente, é possível usar um key.properties privado.
def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android.signingConfigs {
    release {
        if (System.getenv()["CI"]) {
            storeFile file(System.getenv("CM_KEYSTORE_PATH"))
            storePassword System.getenv("CM_KEYSTORE_PASSWORD")
            keyAlias System.getenv("CM_KEY_ALIAS")
            keyPassword System.getenv("CM_KEY_PASSWORD")
        } else if (keystorePropertiesFile.exists()) {
            storeFile file(keystoreProperties['storeFile'])
            storePassword keystoreProperties['storePassword']
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
        }
    }
}

android.buildTypes {
    release {
        debuggable false
        minifyEnabled false
        signingConfig signingConfigs.release
    }
}
